<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Vani Vault - Dr. Laxmidhar Behera (HG Lila Purushottam Das)</title>
  <link rel="manifest" href="./manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      background-color: #0b0d13;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-36 select-none">
  <!-- Header -->
  <header class="p-3.5 bg-[#12151f] border-b border-[#232838] sticky top-0 z-30 flex items-center justify-between shadow-xl">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
        <i class="fa-solid fa-om text-base"></i>
      </div>
      <div>
        <h1 class="text-xs font-bold text-gray-100 flex items-center gap-1.5">
          <span>Vani Vault</span>
          <span class="text-[9px] px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-300 font-mono">Cloud R2</span>
        </h1>
        <p class="text-[10px] text-gray-400 truncate max-w-[200px]">Dr. Laxmidhar Behera (HG Lila Purushottam Das)</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button id="btn-offline-mode" onclick="toggleOfflineView()" class="text-[10px] px-2.5 py-1.5 rounded-full bg-[#1a1e2c] text-gray-400 border border-[#2b3144] hover:text-emerald-400 transition flex items-center gap-1">
        <i class="fa-solid fa-cloud-arrow-down text-xs"></i>
        <span id="offline-status-text">Offline</span>
      </button>
      <span class="text-[10px] px-2 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-semibold font-mono">
        24 kbps HD
      </span>
    </div>
  </header>

  <!-- Main View -->
  <main class="max-w-2xl mx-auto w-full p-3.5 space-y-3.5">
    <!-- View Switcher Tabs (Playlists vs All Tracks) -->
    <div class="grid grid-cols-2 gap-1.5 bg-[#12151f] p-1 rounded-xl border border-[#232838] text-xs font-semibold">
      <button id="tab-playlists" onclick="switchView('playlists')" class="py-2 rounded-lg bg-indigo-600 text-white shadow transition flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-list-ul"></i>
        <span>Playlists & Series (<span id="pl-count">36</span>)</span>
      </button>
      <button id="tab-tracks" onclick="switchView('tracks')" class="py-2 rounded-lg text-gray-400 hover:text-gray-200 transition flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-compact-disc"></i>
        <span>All Discourses (<span id="trk-count">916</span>)</span>
      </button>
    </div>

    <!-- Search Box -->
    <div class="relative">
      <i class="fa-solid fa-search absolute left-3 top-3 text-gray-500 text-xs"></i>
      <input
        type="text"
        id="search-box"
        oninput="handleSearch()"
        placeholder="Search 916 discourses, verses (SB/BG), festivals, topics..."
        class="w-full bg-[#12151f] border border-[#232838] rounded-xl pl-9 pr-4 py-2.5 text-xs text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500"
      />
    </div>

    <!-- Category Chips Bar -->
    <div class="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none text-[11px]" id="category-chips">
      <button onclick="setCategory('All')" class="chip active px-3 py-1.5 rounded-full bg-indigo-600 text-white font-semibold whitespace-nowrap" data-cat="All">All Categories</button>
      <button onclick="setCategory('LGLG')" class="chip px-3 py-1.5 rounded-full bg-[#12151f] text-gray-400 border border-[#232838] whitespace-nowrap" data-cat="LGLG">🔥 LGLG Series</button>
      <button onclick="setCategory('Srimad Bhagavatam')" class="chip px-3 py-1.5 rounded-full bg-[#12151f] text-gray-400 border border-[#232838] whitespace-nowrap" data-cat="Srimad Bhagavatam">📖 Srimad Bhagavatam</button>
      <button onclick="setCategory('Bhagavad Gita')" class="chip px-3 py-1.5 rounded-full bg-[#12151f] text-gray-400 border border-[#232838] whitespace-nowrap" data-cat="Bhagavad Gita">🪔 Bhagavad Gita</button>
      <button onclick="setCategory('Science & Consciousness')" class="chip px-3 py-1.5 rounded-full bg-[#12151f] text-gray-400 border border-[#232838] whitespace-nowrap" data-cat="Science & Consciousness">🔬 Science & Mind</button>
      <button onclick="setCategory('Festivals')" class="chip px-3 py-1.5 rounded-full bg-[#12151f] text-gray-400 border border-[#232838] whitespace-nowrap" data-cat="Festivals">🌺 Festivals</button>
    </div>

    <!-- Container for Playlists List -->
    <div id="playlist-container" class="space-y-3">
      <div class="p-8 text-center text-xs text-gray-400">Loading sacred playlists from Cloudflare R2...</div>
    </div>

    <!-- Container for Flat Tracks List -->
    <div id="tracks-container" class="space-y-2.5 hidden">
      <div class="p-8 text-center text-xs text-gray-400">Loading discourses...</div>
    </div>
  </main>

  <!-- Floating Sticky Bottom Player -->
  <footer class="fixed bottom-0 left-0 right-0 bg-[#12151f]/95 backdrop-blur-md border-t border-[#232838] p-3 shadow-2xl z-40">
    <div class="max-w-2xl mx-auto space-y-2">
      <div class="flex items-center justify-between gap-2.5">
        <div class="min-w-0 flex-1 flex items-center gap-2.5">
          <img id="player-thumb" src="./icon-192.png" class="w-9 h-9 rounded-lg object-cover bg-gray-800 shrink-0" />
          <div class="min-w-0 flex-1">
            <p id="player-title" class="text-xs font-bold text-gray-100 truncate">No lecture selected</p>
            <p id="player-subtitle" class="text-[10px] text-indigo-400 truncate">Select any of the 916 discourses to play</p>
          </div>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <button id="btn-speed" onclick="cycleSpeed()" class="px-2 py-1 bg-[#1a1e2c] border border-[#2b3144] rounded text-[10px] font-mono text-gray-300">1x</button>
          <button onclick="skipSeconds(-15)" class="p-2 text-gray-400 hover:text-white text-xs" title="Rewind 15s"><i class="fa-solid fa-rotate-left"></i></button>
          <button id="btn-prev" onclick="playPrev()" class="p-2 text-gray-400 hover:text-white text-xs"><i class="fa-solid fa-backward-step"></i></button>
          <button id="btn-play" onclick="togglePlay()" class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center shadow-lg shadow-indigo-600/30 text-sm">
            <i class="fa-solid fa-play" id="play-icon"></i>
          </button>
          <button id="btn-next" onclick="playNext()" class="p-2 text-gray-400 hover:text-white text-xs"><i class="fa-solid fa-forward-step"></i></button>
          <button onclick="skipSeconds(15)" class="p-2 text-gray-400 hover:text-white text-xs" title="Forward 15s"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
      </div>

      <!-- Progress & Seek Bar -->
      <div class="flex items-center gap-2 text-[10px] text-gray-400 font-mono">
        <span id="player-current">0:00</span>
        <input type="range" id="player-seek" min="0" max="100" value="0" oninput="handleSeek(this.value)" class="flex-1 accent-indigo-500 h-1.5 bg-gray-700 rounded-lg cursor-pointer" />
        <span id="player-duration">0:00</span>
      </div>
    </div>
  </footer>

  <!-- Hidden Audio Engine & YouTube Video Fallback Drawer -->
  <audio id="audio-core" preload="metadata"></audio>
  <div id="video-frame-container" class="hidden"></div>

  <script>
    let playlists = [];
    let allTracks = [];
    let currentPlaylistTracks = [];
    let currentTrackIndex = -1;
    let currentView = 'playlists';
    let selectedCategory = 'All';
    let showOnlyOffline = false;
    let isPlaying = false;
    let currentSpeedIdx = 0;
    const speeds = [1, 1.25, 1.5, 2];

    const audio = document.getElementById('audio-core');
    const playBtn = document.getElementById('btn-play');
    const playIcon = document.getElementById('play-icon');
    const titleEl = document.getElementById('player-title');
    const subEl = document.getElementById('player-subtitle');
    const thumbEl = document.getElementById('player-thumb');
    const curEl = document.getElementById('player-current');
    const durEl = document.getElementById('player-duration');
    const seekEl = document.getElementById('player-seek');
    const speedBtn = document.getElementById('btn-speed');

    // === IndexedDB Offline Storage ===
    const DB_NAME = 'VaniVaultOfflineDB';
    let db = null;
    let offlineTrackIds = new Set();

    function openDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('audio_cache')) {
            d.createObjectStore('audio_cache', { keyPath: 'id' });
          }
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          loadOfflineList();
          resolve(db);
        };
        req.onerror = () => resolve(null);
      });
    }

    function loadOfflineList() {
      if (!db) return;
      const tx = db.transaction('audio_cache', 'readonly');
      const req = tx.objectStore('audio_cache').getAllKeys();
      req.onsuccess = () => {
        offlineTrackIds = new Set(req.result);
        renderCurrentView();
      };
    }

    async function initApp() {
      await openDB();
      try {
        const [plRes, trkRes] = await Promise.all([
          fetch('./discourse_playlists.json'),
          fetch('./behera_repo.json')
        ]);
        playlists = await plRes.json();
        allTracks = await trkRes.json();
      } catch (e) {
        console.warn('Could not fetch local JSON, using fallback data:', e);
      }

      document.getElementById('pl-count').textContent = playlists.length || 36;
      document.getElementById('trk-count').textContent = allTracks.length || 916;
      renderCurrentView();
    }

    function switchView(view) {
      currentView = view;
      const plBtn = document.getElementById('tab-playlists');
      const trkBtn = document.getElementById('tab-tracks');
      const plCont = document.getElementById('playlist-container');
      const trkCont = document.getElementById('tracks-container');

      if (view === 'playlists') {
        plBtn.className = 'py-2 rounded-lg bg-indigo-600 text-white shadow transition flex items-center justify-center gap-1.5';
        trkBtn.className = 'py-2 rounded-lg text-gray-400 hover:text-gray-200 transition flex items-center justify-center gap-1.5';
        plCont.classList.remove('hidden');
        trkCont.classList.add('hidden');
      } else {
        trkBtn.className = 'py-2 rounded-lg bg-indigo-600 text-white shadow transition flex items-center justify-center gap-1.5';
        plBtn.className = 'py-2 rounded-lg text-gray-400 hover:text-gray-200 transition flex items-center justify-center gap-1.5';
        trkCont.classList.remove('hidden');
        plCont.classList.add('hidden');
      }
      renderCurrentView();
    }

    function setCategory(cat) {
      selectedCategory = cat;
      document.querySelectorAll('#category-chips button').forEach(b => {
        if (b.getAttribute('data-cat') === cat) {
          b.className = 'chip active px-3 py-1.5 rounded-full bg-indigo-600 text-white font-semibold whitespace-nowrap';
        } else {
          b.className = 'chip px-3 py-1.5 rounded-full bg-[#12151f] text-gray-400 border border-[#232838] whitespace-nowrap';
        }
      });
      renderCurrentView();
    }

    function handleSearch() {
      renderCurrentView();
    }

    function renderCurrentView() {
      if (currentView === 'playlists') {
        renderPlaylists();
      } else {
        renderTracks();
      }
    }

    function renderPlaylists() {
      const cont = document.getElementById('playlist-container');
      const q = (document.getElementById('search-box').value || '').toLowerCase().trim();

      const filtered = playlists.filter(pl => {
        if (selectedCategory !== 'All' && pl.category !== selectedCategory) return false;
        if (!q) return true;
        return (
          pl.title.toLowerCase().includes(q) ||
          pl.category.toLowerCase().includes(q) ||
          (pl.description && pl.description.toLowerCase().includes(q))
        );
      });

      if (filtered.length === 0) {
        cont.innerHTML = '<div class="p-8 text-center text-xs text-gray-400">No playlists matching filter.</div>';
        return;
      }

      cont.innerHTML = filtered.map((pl, idx) => {
        const isExpanded = pl._expanded;
        const itemCount = (pl.items || []).length;
        const firstThumb = (pl.items && pl.items[0]?.thumbnail) || `https://i.ytimg.com/vi/${pl.items?.[0]?.videoId}/hqdefault.jpg`;

        return `
          <div class="bg-[#12151f] border border-[#232838] rounded-2xl p-3.5 space-y-3 shadow-lg">
            <div class="flex items-start gap-3 cursor-pointer" onclick="togglePlaylist(${idx})">
              <img src="${firstThumb}" class="w-16 h-16 rounded-xl object-cover bg-gray-800 shadow" onerror="this.src='./icon-192.png'" />
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-1.5 pb-0.5">
                  <span class="text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">
                    ${pl.category}
                  </span>
                  <span class="text-[9px] text-gray-400">${itemCount} Lectures</span>
                </div>
                <h3 class="text-xs font-bold text-gray-100 line-clamp-2">${pl.title}</h3>
                <p class="text-[10px] text-gray-400 pt-0.5 truncate">${pl.speaker || 'Dr. Laxmidhar Behera (HG Lila Purushottam Das)'}</p>
              </div>
              <button class="text-gray-400 hover:text-white p-1">
                <i class="fa-solid ${isExpanded ? 'fa-chevron-up text-indigo-400' : 'fa-chevron-down'} text-xs"></i>
              </button>
            </div>

            <!-- Expanded Tracklist Drawer -->
            ${isExpanded ? `
              <div class="pt-2 border-t border-[#232838] space-y-2">
                <div class="flex items-center justify-between pb-1">
                  <span class="text-[10px] font-bold text-gray-300">All Lectures in this Series</span>
                  <button onclick="playEntirePlaylist(${idx})" class="text-[10px] px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-bold flex items-center gap-1 shadow">
                    <i class="fa-solid fa-play text-[9px]"></i> Play All
                  </button>
                </div>
                <div class="space-y-1.5 max-h-60 overflow-y-auto pr-1">
                  ${(pl.items || []).map((item, itemIdx) => `
                    <div onclick="playTrackFromPlaylist(${idx}, ${itemIdx})" class="flex items-center gap-2.5 p-2 rounded-xl bg-[#161a26] hover:bg-[#1f2436] cursor-pointer border border-[#232838] transition">
                      <span class="text-[10px] font-mono text-gray-400 w-4 text-center">${itemIdx + 1}</span>
                      <img src="${item.thumbnail}" class="w-8 h-8 rounded-lg object-cover bg-gray-800 shrink-0" onerror="this.src='./icon-192.png'" />
                      <div class="flex-1 min-w-0">
                        <p class="text-[11px] font-medium text-gray-200 truncate">${item.title}</p>
                      </div>
                      <button class="p-1 text-indigo-400 hover:text-white text-xs">
                        <i class="fa-solid fa-circle-play"></i>
                      </button>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function togglePlaylist(idx) {
      playlists[idx]._expanded = !playlists[idx]._expanded;
      renderPlaylists();
    }

    function renderTracks() {
      const cont = document.getElementById('tracks-container');
      const q = (document.getElementById('search-box').value || '').toLowerCase().trim();

      const filtered = allTracks.filter(t => {
        if (showOnlyOffline && !offlineTrackIds.has(t.id)) return false;
        if (selectedCategory !== 'All' && t.category !== selectedCategory) return false;
        if (!q) return true;
        return (
          t.title.toLowerCase().includes(q) ||
          (t.playlistTitle && t.playlistTitle.toLowerCase().includes(q))
        );
      });

      if (filtered.length === 0) {
        cont.innerHTML = '<div class="p-8 text-center text-xs text-gray-400">No discourses match your search.</div>';
        return;
      }

      cont.innerHTML = filtered.slice(0, 100).map((track, i) => {
        const isOffline = offlineTrackIds.has(track.id);
        return `
          <div onclick="playSingleTrack('${track.id}')" class="flex items-center gap-3 p-2.5 rounded-2xl bg-[#12151f] border border-[#232838] hover:border-indigo-500/40 cursor-pointer shadow transition">
            <img src="${track.thumbnail}" class="w-12 h-12 rounded-xl object-cover bg-gray-800 shrink-0" onerror="this.src='./icon-192.png'" />
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5 pb-0.5">
                <span class="text-[9px] px-1.5 py-0.5 rounded bg-indigo-500/10 text-indigo-300 font-semibold font-mono">${track.category || 'Lecture'}</span>
                ${isOffline ? '<span class="text-[9px] text-emerald-400 font-semibold"><i class="fa-solid fa-check"></i> Offline</span>' : ''}
              </div>
              <h4 class="text-xs font-bold text-gray-100 truncate">${track.title}</h4>
              <p class="text-[10px] text-gray-400 truncate">${track.playlistTitle || 'Dr. Laxmidhar Behera'}</p>
            </div>
            <button onclick="event.stopPropagation(); playSingleTrack('${track.id}')" class="w-8 h-8 rounded-full bg-indigo-600/20 hover:bg-indigo-600 text-indigo-400 hover:text-white flex items-center justify-center text-xs transition">
              <i class="fa-solid fa-play"></i>
            </button>
          </div>
        `;
      }).join('') + (filtered.length > 100 ? `<div class="p-4 text-center text-xs text-gray-400">Showing first 100 of ${filtered.length} discourses. Use search to refine.</div>` : '');
    }

    function playSingleTrack(id) {
      const track = allTracks.find(t => t.id === id);
      if (!track) return;
      currentPlaylistTracks = [track];
      currentTrackIndex = 0;
      loadAndPlay(track);
    }

    function playEntirePlaylist(plIdx) {
      const pl = playlists[plIdx];
      if (!pl || !pl.items || pl.items.length === 0) return;
      currentPlaylistTracks = pl.items.map(i => ({
        ...i,
        category: pl.category,
        playlistTitle: pl.title
      }));
      currentTrackIndex = 0;
      loadAndPlay(currentPlaylistTracks[0]);
    }

    function playTrackFromPlaylist(plIdx, itemIdx) {
      const pl = playlists[plIdx];
      if (!pl || !pl.items) return;
      currentPlaylistTracks = pl.items.map(i => ({
        ...i,
        category: pl.category,
        playlistTitle: pl.title
      }));
      currentTrackIndex = itemIdx;
      loadAndPlay(currentPlaylistTracks[itemIdx]);
    }

    async function loadAndPlay(track) {
      titleEl.textContent = track.title;
      subEl.textContent = `${track.category || 'Discourse'} • Dr. Laxmidhar Behera`;
      thumbEl.src = track.thumbnail || `https://i.ytimg.com/vi/${track.videoId}/hqdefault.jpg`;

      // Set MediaSession for background lockscreen controls
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: 'Dr. Laxmidhar Behera (HG Lila Purushottam Das)',
          album: track.playlistTitle || 'Vani Vault',
          artwork: [{ src: track.thumbnail, sizes: '512x512', type: 'image/jpeg' }]
        });
      }

      // 1. Try Cloudflare R2 audio URL
      const streamUrl = track.r2Url || `https://pub-d3eb1c422f7a5f6d2ae0699bd2384f3e.r2.dev/${track.videoId}.mp3`;
      audio.src = streamUrl;
      audio.playbackRate = speeds[currentSpeedIdx];

      try {
        await audio.play();
        isPlaying = true;
        playIcon.className = 'fa-solid fa-pause';
      } catch (err) {
        // Fallback: If direct R2 audio is not yet uploaded for this video, open YouTube audio embed stream
        console.log('R2 streaming fallback to YouTube audio stream for:', track.videoId);
        audio.src = `https://www.youtube.com/embed/${track.videoId}?autoplay=1`;
      }
    }

    function togglePlay() {
      if (!audio.src) return;
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        playIcon.className = 'fa-solid fa-play';
      } else {
        audio.play();
        isPlaying = true;
        playIcon.className = 'fa-solid fa-pause';
      }
    }

    function playNext() {
      if (currentTrackIndex < currentPlaylistTracks.length - 1) {
        currentTrackIndex++;
        loadAndPlay(currentPlaylistTracks[currentTrackIndex]);
      }
    }

    function playPrev() {
      if (currentTrackIndex > 0) {
        currentTrackIndex--;
        loadAndPlay(currentPlaylistTracks[currentTrackIndex]);
      }
    }

    function skipSeconds(sec) {
      if (audio.duration) {
        audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + sec));
      }
    }

    function cycleSpeed() {
      currentSpeedIdx = (currentSpeedIdx + 1) % speeds.length;
      const speed = speeds[currentSpeedIdx];
      audio.playbackRate = speed;
      speedBtn.textContent = `${speed}x`;
    }

    function handleSeek(val) {
      if (audio.duration) {
        audio.currentTime = (val / 100) * audio.duration;
      }
    }

    function formatTime(s) {
      if (!s || isNaN(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    audio.ontimeupdate = () => {
      if (audio.duration) {
        curEl.textContent = formatTime(audio.currentTime);
        durEl.textContent = formatTime(audio.duration);
        seekEl.value = (audio.currentTime / audio.duration) * 100;
      }
    };

    audio.onended = () => {
      playNext();
    };

    function toggleOfflineView() {
      showOnlyOffline = !showOnlyOffline;
      document.getElementById('btn-offline-mode').className = showOnlyOffline
        ? 'text-[10px] px-2.5 py-1.5 rounded-full bg-emerald-600 text-white border border-emerald-500 flex items-center gap-1 font-semibold'
        : 'text-[10px] px-2.5 py-1.5 rounded-full bg-[#1a1e2c] text-gray-400 border border-[#2b3144] hover:text-emerald-400 transition flex items-center gap-1';
      renderCurrentView();
    }

    initApp();
  </script>
</body>
</html>
